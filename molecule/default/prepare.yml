---
- name: Prepare cAdvisor Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for cAdvisor Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for cAdvisor Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for cAdvisor Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

    # cAdvisor's whole purpose is to report on the containers of the Docker
    # daemon it is pointed at. Inside the test container that daemon is the one
    # installed just above, so a container started here is exactly the kind of
    # workload cAdvisor is expected to observe once the role has configured it.
    #
    # It is started before the role runs, so that it is already there when
    # cAdvisor first enumerates the runtime, and it is given a name that
    # verify.yml can look for. `docker` is driven through the CLI rather than
    # through community.docker, because the linting environment in CI has no
    # collections installed.
    - name: Ensure a previous observed container is gone
      ansible.builtin.command:
        cmd: "docker rm --force {{ cadvisor_molecule_observed_container_name }}"
      changed_when: false
      failed_when: false

    - name: Ensure the container that cAdvisor is expected to observe is running
      ansible.builtin.command:
        cmd: >-
          docker run --detach
          --name {{ cadvisor_molecule_observed_container_name }}
          {{ cadvisor_molecule_observed_container_image }}
          sleep 3600
      changed_when: true

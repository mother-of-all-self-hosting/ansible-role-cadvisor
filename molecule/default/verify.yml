---
- name: Verify cAdvisor systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for cAdvisor service to become active (up to 180s)
      ansible.builtin.systemd:
        name: cadvisor.service
      register: cadvisor_service
      until: cadvisor_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert cAdvisor service is active
      ansible.builtin.assert:
        that: cadvisor_service.status.ActiveState == 'active'
        fail_msg: "cadvisor.service not active ({{ cadvisor_service.status.ActiveState }})"
        success_msg: "cadvisor.service is active"

    - name: Retrieve cAdvisor service log for debugging
      when: cadvisor_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu cadvisor.service
      changed_when: false

    - name: Wait for cAdvisor HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/containers/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: cadvisor_endpoint
      until: cadvisor_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert cAdvisor HTTP endpoint responds
      ansible.builtin.assert:
        that: cadvisor_endpoint.status in [200, 302]
        fail_msg: "cAdvisor did not respond as expected ({{ cadvisor_endpoint.status | default('no response') }})"
        success_msg: "cAdvisor responded with {{ cadvisor_endpoint.status }}"

    - name: Show cAdvisor systemd service status summary
      ansible.builtin.debug:
        msg:
          - "cAdvisor systemd: {{ cadvisor_service.status.ActiveState }}"
          - "cAdvisor HTTP: {{ cadvisor_endpoint.status }}"
